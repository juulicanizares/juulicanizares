<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Juliana Cañizares — Software Developer Junior</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F3F5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4B6D2"/>
      <stop offset="1" stop-color="#D66B9C"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="280" rx="18" fill="url(#bg)"/>

  <!-- Formas geométricas sutiles (animación lenta) -->
  <circle cx="850" cy="80" r="95" fill="#F4B6D2" opacity=".40">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 12; 0 0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="925" cy="225" r="58" fill="#E8A1C5" opacity=".35">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="11s" repeatCount="indefinite"/>
  </circle>
  <rect x="740" y="170" width="70" height="70" rx="10" fill="none" stroke="#D66B9C" stroke-width="2" opacity=".5" transform="rotate(18 775 205)"/>
  <text x="808" y="152" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="46" font-weight="700" fill="#D66B9C" opacity=".85">&lt;/&gt;</text>

  <!-- Texto -->
  <rect x="70" y="62" width="64" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="130" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="56" font-weight="700" fill="#25232A">Juliana Cañizares</text>
  <text x="72" y="174" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="600" letter-spacing="1.5" fill="#D66B9C">Software Developer Junior</text>
  <text x="72" y="218" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16" textLength="300" lengthAdjust="spacingAndGlyphs" fill="#6B6672">// aprendiendo, construyendo, creciendo</text>
  <rect x="388" y="204" width="9" height="18" fill="#D66B9C">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <rect y="274" width="1000" height="6" fill="url(#accent)"/>
</svg>
